<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1416"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Floaters"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Floaters Jobs</title>

<style>
/* Layout: one-column field app, sticky brand header, job cards, fixed bottom tab bar sized for gloved thumbs */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#0f1416; --muted:#5b6a6e; --line:#d9e2e3;
  --teal:#0d7f86; --teal-ink:#ffffff; --teal-soft:#dff1f1; --gold:#b98a1e; --gold-soft:#fbf1d8;
  --ok:#1f8a4c; --ok-soft:#e1f3e8; --warn:#b4570b; --warn-soft:#fdeedd; --bad:#b3261e;
  --head:#0f1416; --head-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f10; --surface:#151b1d; --ink:#eef3f3; --muted:#9aaaad; --line:#273134;
  --teal:#2bb3ba; --teal-ink:#06191a; --teal-soft:#123234; --gold:#e0b44a; --gold-soft:#2c2412;
  --ok:#4cc27e; --ok-soft:#13291c; --warn:#f0a050; --warn-soft:#2e1f10; --bad:#ff8a80;
  --head:#000000; --head-ink:#ffffff; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b0f10; --surface:#151b1d; --ink:#eef3f3; --muted:#9aaaad; --line:#273134;
  --teal:#2bb3ba; --teal-ink:#06191a; --teal-soft:#123234; --gold:#e0b44a; --gold-soft:#2c2412;
  --ok:#4cc27e; --ok-soft:#13291c; --warn:#f0a050; --warn-soft:#2e1f10; --bad:#ff8a80;
  --head:#000000; --head-ink:#ffffff; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;max-width:720px;margin:0 auto}
header.top img{height:40px;width:auto}
header.top .t{flex:1;min-width:0}
header.top h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1;text-transform:uppercase}
header.top .sub{font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:var(--head-ink);font:600 15px var(--body);padding:8px 4px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
main > .wrap{display:flex;flex-direction:column;gap:14px}
.banner{border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--gold-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.banner b{color:var(--gold)}
h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:6px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.job{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.job:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.job .time{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.job .time small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:4px}
.job .who{min-width:0}
.job .name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .meta{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--teal-soft);color:var(--teal)}
.p-go{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-sample{background:var(--gold-soft);color:var(--gold)}
.who-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px;min-width:0}
.row > .f:has(input[type="datetime-local"]){flex-basis:230px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1407}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
textarea{min-height:80px;resize:vertical}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10}
.tabs button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--teal);flex:none}
.check .price{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.total b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{position:relative;border:2px dashed var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;font-size:14px;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--bg)}
.slot.has{border-style:solid;border-color:var(--teal)}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.slot .lbl{font-weight:600;color:var(--ink);position:relative;z-index:1}
.slot .thumbs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.slot .thumbs img,.slot .thumbs video{width:56px;height:56px;object-fit:cover;border-radius:6px}
.slot .st{font-size:12px}
.plus{font-family:var(--display);font-size:30px;line-height:1;color:var(--teal)}
.timer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.timer .v{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.timer .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.uploads{font-size:14px;color:var(--muted)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar button{min-height:62px;border:0;background:none;color:var(--muted);font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.bar button[aria-current="page"]{color:var(--teal)}
nav.bar svg{width:24px;height:24px}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;max-width:90vw;text-align:center}
.muted{color:var(--muted);font-size:14px}
.done-box{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ink)}
.sec-t{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:12px}
.sub-card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
fieldset.ed{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
fieldset.ed[disabled] input,fieldset.ed[disabled] select,fieldset.ed[disabled] textarea{opacity:.75}
fieldset.ed[disabled] .btn{display:none}
.issues{margin:8px 0 12px;padding:10px 12px 10px 30px;border-radius:10px;background:var(--warn-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.issues.bad{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.issues.bad li::marker{color:var(--bad)}
.ok-t{color:var(--ok);font-weight:600}
.warn-t{color:var(--warn);font-weight:600}
.amend{border-color:var(--gold);background:var(--gold-soft)}
.log{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.log:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.stats b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details.ent summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:28px}
details.ent summary::-webkit-details-marker{display:none}
.ent-n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ent-t{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:0 10px;min-width:40px;text-align:center}
.ent-f{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.ent-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ent-row > div:first-child{min-width:0}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:600 15px var(--body);cursor:pointer;white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--teal);color:var(--teal-ink)}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pk{border:2px solid var(--line);border-radius:10px;padding:4px;background:var(--bg);color:var(--ink);font:500 12px var(--body);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center}
.pk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line)}
.pk.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;max-width:100%;margin:0 auto;aspect-ratio:4/5;width:min(100%,420px)}
.preview.story{aspect-ratio:9/16;width:min(100%,320px)}
.preview img{width:100%;height:100%;object-fit:cover}
.job .thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px}
.job .thumb img{width:100%;height:100%;object-fit:cover}
.chev{font-size:28px;color:var(--muted);line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column}
.tile b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar-row{display:grid;grid-template-columns:minmax(0,110px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bar-k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-f{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar-v{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;text-align:right}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;color:#fff;text-align:center}
.ov-in img{max-height:70vh;object-fit:contain;border-radius:8px;-webkit-touch-callout:default}
@media (prefers-reduced-motion:no-preference){.btn,.tabs button,.seg button{transition:background .15s,color .15s}}
</style></head><body>

function detectType(s){
  s=(s||"").toLowerCase().replace(/\s+/g,"");
  const gn=s.match(/(\d)(h|horse)?(gn|gooseneck|goose)/); if(gn){const n=+gn[1];return n>=6?"GN6":"GN"+Math.max(2,n)}
  const m=s.match(/(\d)(h|horse)?(sl|al|straight|angle)/); if(m){const n=+m[1], t=/sl|straight/.test(m[3])?"SL":"AL"; const id=n+"H"+t; return FLOAT_TYPES.some(f=>f.id===id)?id:(n>=4?"4HAL":"2HSL")}
  if(/caravan|van/.test(s))return "CARAVAN"; if(/car|4wd|ute|suv/.test(s))return "CAR";
  return "";

function loadGis(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=()=>rej(new Error("Couldn't load Google sign-in. Check your connection."));document.head.appendChild(s)})}
let needSignin=false;
(function(){const t=store.get("tok",null); if(t&&t.exp>Date.now()+120000){token=t.token;tokenExp=t.exp}})();
// Google only shows its sign-in window after a tap, so a non-interactive call never opens it:
// it throws NEED_SIGNIN and the app shows a "Reconnect Google" button instead.
async function getToken(interactive){
  if(token&&Date.now()<tokenExp-60000)return token;
  if(!interactive){needSignin=true;throw new Error("NEED_SIGNIN")}
  await loadGis();
  return new Promise((res,rej)=>{
    tokenClient=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:SCOPES,
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));token=r.access_token;tokenExp=Date.now()+r.expires_in*1000;store.set("tok",{token,exp:tokenExp});needSignin=false;S.consented=true;saveSettings();res(token)},
      error_callback:e=>rej(new Error(e.type==="popup_closed"?"the Google window was closed":e.type||"sign-in failed"))});
    tokenClient.requestAccessToken({prompt:S.consented?"":"consent"});
  });
}
async function api(url,opts={}){
  const t=await getToken(false);
  const r=await fetch(url.startsWith("http")?url:"https://www.googleapis.com"+url,{...opts,headers:{Authorization:"Bearer "+t,...(opts.body&&!(opts.body instanceof Blob)?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});
  if(r.status===401){token=null;store.set("tok",null);needSignin=true;throw new Error("NEED_SIGNIN")}
  if(!r.ok){const tx=await r.text();throw new Error("Google said: "+r.status+" "+tx.slice(0,160))}
  needSignin=false;
  return r.status===204?null:r.json();
}

async function ensureFolder(name,parent){

  const q=`name='${name.replace(/'/g,"\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parent?` and '${parent}' in parents`:"");
  const r=await api("/drive/v3/files?"+new URLSearchParams({q,fields:"files(id,webViewLink)",orderBy:"createdTime"}));

  const c=await api("/drive/v3/files?fields=id",{method:"POST",body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:parent?[parent]:[]})});

async function uploadFile(e,j,slot,file,item){

  if(!init.ok)throw new Error("Upload couldn't start ("+init.status+")");

const queue=[]; let busy=false;
function addMedia(id,slot,files){
  const e=events.find(x=>x.id===id), j=job(id); const m=media[id]=media[id]||{}; m[slot]=m[slot]||[];
  const def=SHOT_SLOTS.find(s=>s.id===slot); if(!def.multi)m[slot].forEach(x=>x.replaced=true);
  [...files].forEach(f=>{const it={url:URL.createObjectURL(f),name:f.name,type:f.type,status:S.mode==="live"?"queued":"saved",file:f};m[slot]=def.multi?[...m[slot],it]:[...m[slot].filter(x=>!x.replaced),it];if(S.mode==="live")queue.push({e,j,slot,it})});
  if(j.status==="new"){j.status="in-progress";queueSync(id)}
  render(); pump();
}
async function pump(){
  if(busy)return; const q=queue.find(x=>x.it.status==="queued"); if(!q)return; busy=true; q.it.status="uploading"; render();
  try{await uploadFile(q.e,q.j,q.slot,q.it.file,q.it);q.it.status="done";q.it.file=null}catch(err){q.it.status="failed";q.it.err=err.message}
  queue.splice(queue.indexOf(q),1); busy=false; render(); pump();
}

/* ======================= Shared data store =======================
   Competitions, templates and social posts are shared between Kyle and Brandon.
   Sample mode: kept on this phone. Live mode: one JSON file ("floaters-data.json") in the
   shared "Floaters Jobs" Drive folder, merged record-by-record (newest edit wins). */
const DB_EMPTY = () => ({comps:{}, templates:{}, posts:{}});
let DB = Object.assign(DB_EMPTY(), store.get("db", {}));
const uid = p => (p||"") + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function dbList(coll){ return Object.values(DB[coll]||{}).filter(r=>!r.deleted); }
function dbGet(coll,id){ const r=DB[coll]?.[id]; return r&&!r.deleted?r:null; }
function dbPut(coll,rec){ rec.updatedAt=Date.now(); rec.updatedBy=S.me; DB[coll][rec.id]=rec; dbSave(); return rec; }
function dbDelete(coll,id){ const r=DB[coll][id]; if(r){ r.deleted=true; dbPut(coll,r); } }

function mergeDB(local, remote){
  const out = DB_EMPTY();
  for(const coll of Object.keys(out)){
    const a=local[coll]||{}, b=remote[coll]||{};
    for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
      const x=a[id], y=b[id];
      out[coll][id] = !x ? y : !y ? x : ((y.updatedAt||0) > (x.updatedAt||0) ? y : x);
    }
  }
  return out;
}
function storeLocal(){
  // Images are big: keep them out of phone storage if it's full.
  try{ localStorage.setItem("fl_db", JSON.stringify(DB)); }
  catch(e){ try{ const slim=JSON.parse(JSON.stringify(DB)); Object.values(slim.posts).forEach(p=>{ if(p.image&&p.image.startsWith("data:")) p.image=""; }); localStorage.setItem("fl_db", JSON.stringify(slim)); }catch(e2){} }
}
let dbTimer=null, dbSyncing=false;
function dbSave(){
  storeLocal();
  if(S.mode!=="live") return;
  clearTimeout(dbTimer);
  dbTimer=setTimeout(()=>dbSync().catch(e=>toast("Couldn't save to Drive: "+e.message)), 1500);
}
async function dataFileId(){
  if(S.dataFileId) return S.dataFileId;
  const root=await rootFolder();
  const r=await api("/drive/v3/files?"+new URLSearchParams({q:`name='floaters-data.json' and '${root}' in parents and trashed=false`,fields:"files(id)"}));
  if(r.files?.length){ S.dataFileId=r.files[0].id; saveSettings(); return S.dataFileId; }
  const c=await api("/drive/v3/files?fields=id",{method:"POST",body:JSON.stringify({name:"floaters-data.json",mimeType:"application/json",parents:[root]})});
  S.dataFileId=c.id; saveSettings(); return c.id;
}
async function dbPull(){
  if(S.mode!=="live") return;
  const id=await dataFileId();
  const t=await getToken(false);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+t}});
  if(r.ok){ const txt=await r.text(); if(txt.trim()){ DB=mergeDB(DB, JSON.parse(txt)); storeLocal(); } }
}
async function dbSync(){
  if(dbSyncing){ dbSave(); return; }
  dbSyncing=true;
  try{
    await dbPull();
    const id=await dataFileId(); const t=await getToken(false);
    const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(DB)});
    if(!r.ok) throw new Error("Drive said "+r.status);
  } finally { dbSyncing=false; }
}

const fmtDate = v => { if(!v) return "–"; const d=new Date(v.length===10?v+"T12:00:00":v); return isNaN(d)?"–":d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"}); };

/* ---------- pure logic (tested) ---------- */
const norm = s => String(s||"").toLowerCase().replace(/^@/,"").replace(/[^a-z0-9]+/g," ").trim();
function personKey(e){ return norm(e.name) || ("@"+norm(e.handle)); }
function tally(c){
  const people=new Map(); const start=ms(c.start), end=ms(c.end);
  const excludes=String(c.exclude||"").split(/[,\n]/).map(norm).filter(Boolean);
  const sorted=[...c.entries].sort((a,b)=>a.at-b.at);
  for(const e of sorted){
    const key=personKey(e); if(!key||key==="@") continue;
    let p=people.get(key);
    if(!p){ p={key,name:e.name||("@"+e.handle),handles:new Set(),platforms:new Set(),tickets:0,raw:0,entries:[],flags:new Set()}; people.set(key,p); }
    if(e.handle)p.handles.add(e.handle.replace(/^@/,"")); if(e.platform)p.platforms.add(e.platform);
    const m=c.methods.find(x=>x.id===e.method); let status="ok";
    if(!m) status="method removed";
    else if(excludes.some(x=>key===x||key.includes(x))) status="not eligible";
    else if(isNaN(e.at)||e.at<start||e.at>end) status=e.at<start?"before start":"after close";
    else if(m.kind==="tag"&&e.platform==="facebook") status="Facebook tag entries not allowed";
    else if(m.limit==="once"&&p.entries.some(x=>x.status==="ok"&&x.method===e.method)) status="over limit";
    else if(m.limit==="daily"&&p.entries.some(x=>x.status==="ok"&&x.method===e.method&&dayKey(new Date(x.at))===dayKey(new Date(e.at)))) status="over daily limit";
    const n=status==="ok"?Math.max(0,+m.entries||0)*(+e.count||1):0;
    p.entries.push({...e,status,tickets:n}); p.raw+=n; if(status!=="ok")p.flags.add(status);
  }
  for(const p of people.values()){ p.tickets=c.maxPerPerson>0?Math.min(p.raw,+c.maxPerPerson):p.raw; if(p.raw>p.tickets)p.flags.add("capped at "+c.maxPerPerson); if(p.platforms.size>1)p.flags.add("entered on both"); }
  return [...people.values()].sort((a,b)=>b.tickets-a.tickets||a.name.localeCompare(b.name));
}
function secureRandom(){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; }
function weightedDraw(pool, n, rnd=secureRandom){
  const left=pool.filter(p=>p.tickets>0).map(p=>({...p})); const picks=[];
  while(picks.length<n&&left.length){
    const total=left.reduce((s,p)=>s+p.tickets,0); const r=rnd(); let x=r*total, i=0;
    while(i<left.length-1&&x>=left[i].tickets){ x-=left[i].tickets; i++; }
    picks.push({name:left[i].name,key:left[i].key,tickets:left[i].tickets,outOf:total,r:+r.toFixed(6)}); left.splice(i,1);
  }
  return picks;
}
const prizePool = c => c.prizes.reduce((s,p)=>s+(+p.value||0)*(+p.qty||1),0);
const prizeSlots = c => c.prizes.flatMap(p=>Array.from({length:Math.max(1,+p.qty||1)},()=>p.name||"Prize"));
function compIssues(c){
  const err=[], warn=[]; const pool=prizePool(c);
  if(!c.name.trim()||c.name==="New competition") err.push("Give the competition a name.");
  if(isNaN(ms(c.start))||isNaN(ms(c.end))) err.push("Set when entries open and close.");
  else if(ms(c.end)<=ms(c.start)) err.push("Entries must close after they open.");
  if(c.drawType==="chance"&&!isNaN(ms(c.drawAt))&&ms(c.drawAt)<ms(c.end)) err.push("The draw must be after entries close.");
  if(!c.prizes.some(p=>p.name.trim())) err.push("Add at least one prize.");
  if(!c.methods.length) err.push("Add at least one way to enter.");
  if(c.methods.some(m=>!m.label.trim())) err.push("Every way to enter needs a description.");
  if(c.drawType==="skill"&&!c.judging.trim()) err.push("Say how entries will be judged.");
  if(!c.platforms.length) err.push("Pick Facebook, Instagram or both.");
  if(c.methods.some(m=>m.kind==="tag")&&c.platforms.includes("facebook")) warn.push("Facebook's rules don't allow “tag a friend to enter”. Tag entries from Facebook won't count.");
  if(c.region==="Australia"&&c.drawType==="chance"){
    if(pool>10000) warn.push("Prize pool over $10,000 open Australia-wide: you need NSW, SA and ACT permits.");
    else if(pool>5000) warn.push("Prize pool over $5,000 open Australia-wide: you need SA and ACT permits.");
    else if(pool>3000) warn.push("Prize pool over $3,000 open Australia-wide: you need an ACT permit. Make it Victoria-only to avoid this.");
  }
  if(!c.tcsUrl) warn.push("Add the link to the full T&Cs on your website (Post & T&Cs tab).");
  if(!S.promoterAbn) warn.push("Add your ABN or registered business name in Comps → Promoter details.");
  if(c.prizes.some(p=>p.name.trim()&&!(+p.value>0))) warn.push("Give every prize a dollar value (needed in the T&Cs).");
  return {err,warn};
}
function andList(a){ return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a[a.length-1]; }

function compTcs(c){

  const pool=prizePool(c); const L=[];
  L.push(`${c.name} – Terms and Conditions`);

  L.push(`2. The competition runs from ${fmtDateTime(c.start)} to ${fmtDateTime(c.end)} (Melbourne time). Entries received outside these times will not count.`);
  L.push(`3. Entry is open to ${c.region==="Victoria"?"residents of Victoria, Australia":"Australian residents"} aged ${c.age} or over. The Promoter, its owners, their immediate families and anyone involved in running the competition cannot enter or win.`);
  L.push(`4. How to enter on ${plats}:\n`+c.methods.map(m=>`   • ${m.label}${m.kind==="tag"?" (Instagram only)":""} – ${m.entries} entr${m.entries==1?"y":"ies"}, ${LIMITS[m.limit].toLowerCase()}.`).join("\n"));
  L.push(`5. ${c.maxPerPerson>0?`Each person can have a maximum of ${c.maxPerPerson} entries in total.`:"There is no overall cap on entries per person beyond the limits above."} Liking, following or sharing is not required and does not give extra entries. Entries from fake, duplicate or automated accounts will be removed.`);
  L.push(c.drawType==="chance"
    ? `6. This is a game of chance. ${prizeSlots(c).length} winner${prizeSlots(c).length>1?"s":""} and ${c.reserves} reserve${c.reserves==1?"":"s"} will be drawn at random at ${fmtDateTime(c.drawAt)} at ${c.drawPlace}, using a random number generator. Each valid entry has an equal chance of being drawn.`
    : `6. This is a game of skill and chance plays no part in deciding the winner. Entries will be judged by the Promoter on: ${c.judging}. Judging will take place at ${c.drawPlace} on ${fmtDateTime(c.drawAt)}. The judges' decision is final.`);

  L.push(`9. Winners must reply within ${c.claimDays} days of being contacted to claim their prize. ${c.unclaimed==="redraw"&&c.drawType==="chance"?`If a prize is not claimed in time, it will go to the next reserve drawn, who will be contacted the same way.`:"If a prize is not claimed in time, the winner forfeits it."}`);
  L.push(`10. Prizes are not transferable and cannot be exchanged for cash. Service prizes must be booked within 12 months, are subject to availability and the Promoter's service area, and may need a standard garden tap and 240V power at the location. If a prize becomes unavailable, the Promoter may substitute a prize of equal or greater value.`);
  L.push(`11. This competition is in no way sponsored, endorsed, administered by or associated with Facebook, Instagram or Meta Platforms, Inc. By entering, entrants release Meta from all liability and acknowledge that they are providing their information to the Promoter, not to Meta.`);
  L.push(`12. Personal information collected will only be used to run this competition and contact winners. It will not be sold or given to anyone else.`);
  L.push(`13. The Promoter can disqualify entries that break these terms, are offensive, or try to manipulate the competition. Nothing in these terms limits rights under the Australian Consumer Law.`);
  L.push(`14. If the competition can't run as planned for reasons outside the Promoter's control, the Promoter may change, pause or cancel it, subject to any applicable law. Any change will be posted on the competition post.`);
  if(c.extraTerms.trim()) L.push(`15. ${c.extraTerms.trim()}`);
  if(c.amendments.length) L.push(`Amendments:\n`+c.amendments.map(a=>`   • ${fmtDate(new Date(a.at).toISOString())}: ${a.why}`).join("\n"));
  return L.join("\n\n");

function setPath(o,path,v){ const k=path.split("."); let x=o; for(let i=0;i<k.length-1;i++) x=x[k[i]]; x[k[k.length-1]]=v; }

function parsePaste(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^(reply|like|see translation|\d+[smhdw]|\d+ (likes?|replies))$/i.test(l)).map(l=>{
    let who=l; const m=l.match(/^(.{2,60}?)\s*[:\-–]\s+.+$/); if(m) who=m[1];
    who=who.trim(); if(who.split(/\s+/).length>5) return null;
    return who.startsWith("@")||/^[a-z0-9._]+$/.test(who)&&!/\s/.test(who)&&/[._\d]/.test(who) ? {name:"",handle:who.replace(/^@/,"")} : {name:who,handle:""};
  }).filter(Boolean).filter((p,i,a)=>a.findIndex(q=>personKey(q)===personKey(p))===i);
}

    if(pm&&j.whSold>0&&!c.entries.some(x=>x.jobId===ev.id&&x.method===pm.id)) add.push({name:ev.customer,handle:"",platform:"other",method:pm.id,at,count:j.whSold,jobId:ev.id,note:j.whSold+" WORK HORSE",source:"job"});

function cDraw(c){
  const t=tally(c).filter(p=>p.tickets>0); const slots=prizeSlots(c);
  if(c.status==="draft"||c.status==="live") return `<div class="card"><p class="sec-t">Not ready yet</p><p class="muted">Close entries on the Rules tab first. ${c.drawType==="chance"?"The draw":"Judging"} is due ${esc(fmtDateTime(c.drawAt))}.</p></div>`;
  let html="";
  if(c.status==="closed"){
    html+=c.drawType==="chance"
      ? `<div class="card"><p class="sec-t">Ready to draw</p><p>${t.length} eligible entrant${t.length==1?"":"s"} with ${t.reduce((s,p)=>s+p.tickets,0)} entries. Drawing ${slots.length} winner${slots.length>1?"s":""} and ${c.reserves} reserve${c.reserves==1?"":"s"}.</p>
         <label class="f">Witness (someone watching the draw)<input id="dr-witness" placeholder="e.g. Brandon Hubbard" value="${esc(view.witness||"")}" data-m="witness"></label>
         ${view.confirm==="draw"?`<p><b>Draw now?</b> This can't be undone and will be recorded.</p><div class="row"><button class="btn gold" data-act="do_draw">Draw winners</button><button class="btn" data-act="comp_confirm" data-c="">Cancel</button></div>`:`<button class="btn gold" style="margin-top:10px" data-act="comp_confirm" data-c="draw" ${t.length?"":"disabled"}>Draw winners</button>`}
         ${t.length?"":`<p class="warn-t">No eligible entries yet. Check the Entries tab – entries outside the competition dates don't count.</p>`}<p class="muted">Each entry has an equal chance. The app uses your phone's secure random number generator and saves a full record.</p></div>`
      : `<div class="card"><p class="sec-t">Pick the winner${slots.length>1?"s":""}</p><p class="muted" style="margin-top:0">Judged on: ${esc(c.judging)}</p>
         <label class="f">Judges<input id="dr-witness" placeholder="Kyle Steer, Brandon Hubbard" value="${esc(view.witness||"")}" data-m="witness"></label>
         ${slots.map((s,i)=>`<label class="f" style="margin-top:10px">Winner – ${esc(s)}<select id="jg-${i}" data-m="judge" data-i="${i}"><option value="">Choose…</option>${t.map(p=>`<option value="${esc(p.key)}" ${view.judged?.[i]===p.key?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`).join("")}
         <button class="btn gold" style="margin-top:12px" data-act="do_judge">Confirm winner${slots.length>1?"s":""}</button></div>`;
  }
  if(c.winners.length){
    html+=`<h2>Winners</h2>`+c.winners.map((w,i)=>{
      const dl=w.contactedAt?w.contactedAt+c.claimDays*86400000:null; const late=dl&&Date.now()>dl&&w.status==="contacted";
      const pill={drawn:["Not contacted yet","p-go"],contacted:[late?"Claim time over":"Waiting for reply",late?"p-go":"p-new"],claimed:["Claimed","p-done"],forfeited:["Didn't claim","p-sample"]}[w.status];
      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><p class="sec-t" style="margin:0">${esc(w.prize)}</p><div style="font-size:20px;font-weight:600">${esc(w.name)}</div>${w.fromReserve?`<span class="muted">Drawn from reserves</span>`:""}</div><span class="pill ${pill[1]}">${pill[0]}</span></div>
      ${dl&&w.status==="contacted"?`<p class="muted">Must claim by ${esc(fmtDateTime(new Date(dl).toISOString()))}</p>`:""}
      ${w.status!=="forfeited"?`<div class="msg" id="wm-${i}" style="margin-top:10px">${esc(winnerMsg(c,w))}</div>`:""}
      <div class="row" style="margin-top:10px">${w.status==="drawn"?`<button class="btn" data-act="copy_el" data-el="wm-${i}">Copy message</button><button class="btn primary" data-act="w_set" data-i="${i}" data-s="contacted">Mark contacted</button>`:""}
      ${w.status==="contacted"?`<button class="btn primary" data-act="w_set" data-i="${i}" data-s="claimed">Claimed</button><button class="btn" data-act="w_forfeit" data-i="${i}">Didn't claim${c.unclaimed==="redraw"&&c.drawType==="chance"?" – use reserve":""}</button>`:""}</div></div>`;}).join("");
    if(c.reservesLeft?.length) html+=`<div class="card"><p class="sec-t">Reserves (in order)</p>${c.reservesLeft.map((r,i)=>`<div class="ent-row"><span>${i+1}. ${esc(r.name)}</span></div>`).join("")}</div>`;
    html+=`<div class="row"><button class="btn" data-act="w_post">Create winner announcement post</button></div>`;
  }
  if(c.draws.length){ const rec=drawRecord(c); html+=`<div class="card"><p class="sec-t">Draw record</p><div class="msg" id="dr-rec" style="max-height:260px;overflow:auto">${esc(rec)}</div><div class="row" style="margin-top:10px"><button class="btn" data-act="copy_el" data-el="dr-rec">Copy record</button>${S.mode==="live"?`<button class="btn" data-act="rec_drive">Save to Drive</button>`:""}</div></div>`; }
  return html;
}
CHANGES.witness = t => { view.witness=t.value; };
CHANGES.judge = t => { view.judged=view.judged||[]; view.judged[+t.dataset.i]=t.value; };
function drawRecord(c){
  const L=[`DRAW RECORD – ${c.name}`,`Promoter: ${S.promoterName||"Floaters Cleaning"} ${S.promoterAbn||""}`.trim(),`Entries period: ${fmtDateTime(c.start)} to ${fmtDateTime(c.end)}`];
  c.draws.forEach(d=>{
    L.push("",`${d.type==="skill"?"Judging":"Draw"} ${d.reason?"("+d.reason+") ":""}at ${fmtDateTime(new Date(d.at).toISOString())} by ${d.by}${d.witness?` · ${d.type==="skill"?"Judges":"Witness"}: ${d.witness}`:""}`);
    if(d.type==="chance"){ L.push(`Eligible entrants: ${d.pool.length} · Total entries: ${d.total}`,`Method: weighted random draw without replacement, crypto.getRandomValues`);
      d.picks.forEach((p,i)=>L.push(`  ${i+1}. ${p.name} (${p.tickets} of ${p.outOf} entries, random ${p.r}) → ${p.role}`));
      L.push("Entrant list:",...d.pool.map(p=>`  ${p.name}: ${p.tickets}`)); }
    else d.picks.forEach(p=>L.push(`  ${p.name} → ${p.role}`));
  });
  c.winners.forEach(w=>L.push(`Winner status – ${w.prize}: ${w.name}, ${w.status}${w.contactedAt?", contacted "+fmtDateTime(new Date(w.contactedAt).toISOString()):""}`));
  if(c.amendments.length) L.push("","Amendments:",...c.amendments.map(a=>`  ${fmtDateTime(new Date(a.at).toISOString())} ${a.by}: ${a.why} (changed ${a.what})`));
  return L.join("\n");
}
ACTIONS.do_draw = () => {
  const c=dbGet("comps",view.id); const pool=tally(c).filter(p=>p.tickets>0); const slots=prizeSlots(c);
  const picks=weightedDraw(pool, slots.length+(+c.reserves||0));
  picks.forEach((p,i)=>p.role=i<slots.length?"Winner – "+slots[i]:"Reserve "+(i-slots.length+1));
  c.draws.push({type:"chance",at:Date.now(),by:S.me,witness:(view.witness||"").trim(),pool:pool.map(p=>({name:p.name,tickets:p.tickets})),total:pool.reduce((s,p)=>s+p.tickets,0),picks});
  c.winners=picks.slice(0,slots.length).map((p,i)=>({name:p.name,key:p.key,prize:slots[i],status:"drawn"}));

function drawCover(ctx,img,x,y,w,h){ const s=Math.max(w/img.width,h/img.height); const sw=w/s, sh=h/s; ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h); }
function enhance(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h), a=d.data; const B=1.05, C=1.08, Sat=1.12;
  for(let i=0;i<a.length;i+=4){
    let r=a[i]*B, g=a[i+1]*B, b=a[i+2]*B;
    r=(r-128)*C+128; g=(g-128)*C+128; b=(b-128)*C+128;
    const l=0.299*r+0.587*g+0.114*b; r=l+(r-l)*Sat; g=l+(g-l)*Sat; b=l+(b-l)*Sat;
    a[i]=r<0?0:r>255?255:r; a[i+1]=g<0?0:g>255?255:g; a[i+2]=b<0?0:b>255?255:b;
  }
  ctx.putImageData(d,0,0);
}
async function stampLogo(ctx,W,H,scale=0.30){

function label(ctx,text,x,y,W){

  rr(x,y,tw+pad*2,fs+pad*1.2,fs*0.3); ctx.fill(); ctx.fillStyle="#ffffff"; ctx.textBaseline="top"; ctx.fillText(text,x+pad,y+pad*0.65);

async function composePhoto({srcs,kind,format,enh}){
  try{ await document.fonts.load('700 40px "Barlow Condensed"'); }catch(e){}

  ctx.fillStyle="#0f1416"; ctx.fillRect(0,0,W,H);
  const imgs=await Promise.all(srcs.map(loadImg));
  if(kind==="beforeafter"&&imgs.length===2){
    const gap=8, h=(H-gap)/2; drawCover(ctx,imgs[0],0,0,W,h); drawCover(ctx,imgs[1],0,h+gap,W,h);
    if(enh) enhance(ctx,W,H);

function wrapText(ctx,text,maxW){ const words=text.split(/\s+/); const lines=[]; let line=""; for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW&&line){ lines.push(line); line=w; } else line=t; } if(line) lines.push(line); return lines; }
async function composeCard({kicker,headline,format}){

  ctx.fillStyle="#0d7f86"; ctx.beginPath(); ctx.moveTo(0,H*0.80); ctx.bezierCurveTo(W*0.3,H*0.74,W*0.6,H*0.88,W,H*0.78); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#2bb3ba"; ctx.globalAlpha=.35; ctx.beginPath(); ctx.moveTo(0,H*0.84); ctx.bezierCurveTo(W*0.35,H*0.79,W*0.65,H*0.92,W,H*0.83); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  const L=await logo(); const lw=W*0.62, lh=L.height*lw/L.width; ctx.drawImage(L,(W-lw)/2,H*0.07,lw,lh);
  const pad=W*0.09; let y=H*0.07+lh+H*0.07;
  ctx.fillStyle="#e0b44a"; ctx.font=`700 ${W*0.05}px "Barlow Condensed","Arial Narrow",Arial,sans-serif`; ctx.textBaseline="top"; ctx.fillText(kicker.toUpperCase(),pad,y); y+=W*0.08;

/* ---------- scorecard ---------- */
function periodRange(p){
  const now=new Date(); const s=new Date(now); s.setHours(0,0,0,0); let e;
  if(p==="week"||p==="lastweek"){ const dow=(s.getDay()+6)%7; s.setDate(s.getDate()-dow); if(p==="lastweek") s.setDate(s.getDate()-7); e=new Date(s); e.setDate(e.getDate()+7); }
  else if(p==="month"||p==="lastmonth"){ s.setDate(1); if(p==="lastmonth") s.setMonth(s.getMonth()-1); e=new Date(s); e.setMonth(e.getMonth()+1); }
  else { s.setDate(s.getDate()-89); e=new Date(now); e.setHours(24,0,0,0); }
  return [s.getTime(), e.getTime()];
}
function doneAt(e,j){ return j.times?.end || e.end.getTime(); }
function scoreData(p){
  const [s,e]=periodRange(p); const rows=[];
  events.forEach(ev=>{ const j=job(ev.id); if(j.status!=="done") return; const at=doneAt(ev,j); if(at>=s&&at<e) rows.push({ev,j}); });
  const sum=f=>rows.reduce((a,r)=>a+(f(r)||0),0);
  const labour=sum(r=>r.j.times.end&&r.j.times.work?r.j.times.end-r.j.times.work:0)/3600000;
  const travel=sum(r=>r.j.times.work&&r.j.times.travel?r.j.times.work-r.j.times.travel:0)/3600000;
  const revenue=sum(r=>+r.j.paid);
  const addonCount=sum(r=>r.j.addons.length), addonValue=sum(r=>r.j.addons.reduce((a,id)=>a+(ADDONS.find(x=>x.id===id)?.price||0),0));
  const by=(f)=>{ const m={}; rows.forEach(r=>{ const k=f(r)||"Not recorded"; m[k]=m[k]||{n:0,v:0}; m[k].n++; m[k].v+=+r.j.paid||0; }); return Object.entries(m).sort((a,b)=>b[1].n-a[1].n); };
  const src=r=>{ const x=(r.ev.source||"").split(/[–-]/)[0].trim(); return x?x[0].toUpperCase()+x.slice(1).toLowerCase():""; };
  const [ns,ne]=[Date.now(),Date.now()+7*86400000]; let booked=0, bookedN=0;
  events.forEach(ev=>{ if(ev.start.getTime()>=ns&&ev.start.getTime()<ne&&statusOf(ev)!=="done"){ const q=quote(job(ev.id)); bookedN++; booked+=q.total||0; } });
  return {rows, n:rows.length, revenue, avg:rows.length?revenue/rows.length:0, labour, travel, perHour:labour?revenue/labour:0,
    addonCount, addonValue, wh:sum(r=>r.j.whSold), rebooks:rows.filter(r=>r.j.rebook).length, reviews:rows.filter(r=>r.j.reviewAt).length,
    consent:rows.filter(r=>r.j.consent).length, bySource:by(src), byType:by(r=>r.j.type), byWho:by(r=>r.j.by||(r.ev.colorId===S.colours.Brandon?"Brandon":r.ev.colorId===S.colours.Kyle?"Kyle":"")), booked, bookedN};
}
const hrs = h => h? (Math.floor(h)+"h"+String(Math.round((h%1)*60)).padStart(2,"0")) : "0h00";
function bars(list,valueKey){
  const max=Math.max(1,...list.map(([,v])=>v[valueKey]));
  return list.map(([k,v])=>`<div class="bar-row"><span class="bar-k">${esc(k)}</span><span class="bar-t"><span class="bar-f" style="width:${(v[valueKey]/max*100).toFixed(1)}%"></span></span><span class="bar-v">${valueKey==="v"?money(v.v):v.n}</span></div>`).join("") || `<p class="muted">No jobs in this period.</p>`;
}
VIEWS.score = () => {
  const d=scoreData(view.period||"week");
  const tile=(v,k,sub)=>`<div class="tile"><b>${v}</b><span>${k}</span>${sub?`<small>${sub}</small>`:""}</div>`;
  return `${S.mode!=="live"?`<div class="banner"><b>Sample numbers</b> from the sample bookings.</div>`:""}
  <div class="seg scroll">${[["week","This week"],["lastweek","Last week"],["month","This month"],["lastmonth","Last month"],["90","90 days"]].map(([k,l])=>`<button class="${(view.period||"week")===k?"on":""}" data-act="sc_period" data-p="${k}">${l}</button>`).join("")}</div>
  <div class="tiles">${tile(d.n,"Jobs done")}${tile(money(d.revenue),"Paid")}${tile(money(Math.round(d.avg)),"Average job")}${tile(money(Math.round(d.perHour)),"Per labour hour")}</div>
  <div class="card"><p class="sec-t">Time</p><dl class="kv"><dt>Labour</dt><dd>${hrs(d.labour)}</dd><dt>Travel</dt><dd>${hrs(d.travel)}${d.labour?` <span class="muted">(${Math.round(d.travel/(d.labour+d.travel)*100)}% of total time)</span>`:""}</dd></dl></div>
  <div class="card"><p class="sec-t">Extras</p><dl class="kv"><dt>Add-ons sold</dt><dd>${d.addonCount} · ${money(d.addonValue)} at list price</dd><dt>WORK HORSE sold</dt><dd>${d.wh} bottle${d.wh==1?"":"s"}</dd><dt>Rebooks set</dt><dd>${d.rebooks} of ${d.n}</dd><dt>Review asked</dt><dd>${d.reviews} of ${d.n}</dd><dt>Photo consent</dt><dd>${d.consent} of ${d.n}</dd></dl></div>
  <div class="card"><p class="sec-t">Where jobs came from</p>${bars(d.bySource,"n")}</div>

  <div class="card"><p class="sec-t">Next 7 days</p><p style="margin:0">${d.bookedN} job${d.bookedN==1?"":"s"} booked, about <b>${money(d.booked)}</b> at quoted prices.</p></div>
  <p class="muted">Money is what you recorded as paid in the app. It doesn't include costs, GST or fuel.</p>`;
};

/* ---------- customers ---------- */
function customers(){
  const m=new Map(); const today=dayKey(new Date());
  events.forEach(ev=>{ const k=norm(ev.customer); if(!k) return; let c=m.get(k); if(!c){ c={key:k,name:ev.customer,phone:"",jobs:[],spent:0,last:null,next:null,rebook:"",source:""}; m.set(k,c); }
    const j=job(ev.id); c.jobs.push(ev); if(ev.phone) c.phone=ev.phone; if(!c.source&&ev.source) c.source=ev.source;
    if(j.status==="done"){ c.spent+=+j.paid||0; if(!c.last||ev.start>c.last.start) c.last=ev; if(j.rebook&&(!c.rebook||j.rebook>c.rebook)) c.rebook=j.rebook; }
    else if(dayKey(ev.start)>=today&&(!c.next||ev.start<c.next.start)) c.next=ev; });
  const soon=dayKey(new Date(Date.now()+14*86400000));
  return [...m.values()].map(c=>Object.assign(c,{due:!!c.rebook&&!c.next&&c.rebook<=soon})).sort((a,b)=>(b.due-a.due)||((b.last?.start||0)-(a.last?.start||0)));
}
VIEWS.customers = () => {
  const q=norm(view.q||""); const list=customers().filter(c=>!q||c.key.includes(q)||(c.phone||"").replace(/\s/g,"").includes(q.replace(/\s/g,"")));
  return `<label class="f">Search<input id="cu-q" type="search" data-m="cu_q" value="${esc(view.q||"")}" placeholder="Name or phone"></label>
  ${list.length?list.map(c=>`<button class="card job" data-act="cu_open" data-k="${esc(c.key)}" style="grid-template-columns:1fr auto"><div class="who"><div class="name">${esc(c.name)}</div>
    <div class="meta">${c.jobs.filter(e=>job(e.id).status==="done").length} done · ${money(c.spent)}${c.last?` · last ${esc(fmtDate(dayKey(c.last.start)))}`:""}</div></div>
    ${c.due?`<span class="pill p-go">Rebook due</span>`:c.next?`<span class="pill p-new">Booked ${esc(fmtDay(c.next.start).split(",")[0])}</span>`:""}</button>`).join(""):`<div class="card empty">No customers match.</div>`}
  <p class="muted">Customers come from your calendar bookings${S.mode==="live"?" (last 120 days and next 60)":""}.</p>`;
};
CHANGES.cu_q = t => { view.q=t.value; rerender(); };
ACTIONS.cu_open = t => { const c=customers().find(x=>x.key===t.dataset.k); go(sub(c.name,"Customers",{name:"customer",k:c.key,nav:"more"})); };
VIEWS.customer = () => {
  const c=customers().find(x=>x.key===view.k); if(!c) return `<div class="card empty">Customer not found.</div>`;
  const jobs=[...c.jobs].sort((a,b)=>b.start-a.start);
  return `<div class="card"><dl class="kv"><dt>Phone</dt><dd>${esc(c.phone||"–")}</dd><dt>First came from</dt><dd>${esc(c.source||"–")}</dd><dt>Total paid</dt><dd>${money(c.spent)}</dd><dt>Next booking</dt><dd>${c.next?esc(fmtDay(c.next.start)):"None"}</dd><dt>Rebook date</dt><dd>${c.rebook?esc(fmtDate(c.rebook))+(c.due?' <span class="pill p-go">Due</span>':""):"–"}</dd></dl>
    ${c.phone?`<div class="row" style="margin-top:12px"><a class="btn primary" href="tel:${esc(c.phone.replace(/\s/g,""))}">Call</a><a class="btn" href="sms:${esc(c.phone.replace(/\s/g,""))}">Text</a></div>`:""}</div>
  <h2>Jobs</h2>${jobs.map(e=>jobCard(e,true)).join("")}`;
};

/* ======================= boot ======================= */
(async function boot(){
  render();
  try{ await loadEvents(); }catch(e){ if(e.message!=="NEED_SIGNIN") toast("Couldn't reach Google Calendar: "+e.message); }
  try{ await dbPull(); }catch(e){}
  render();
  setInterval(async()=>{ if(S.mode!=="live"||document.hidden||document.activeElement?.matches("input,textarea,select")) return; try{ await loadEvents(); await dbPull(); rerender(); }catch(e){} }, 5*60000);
})();

</script>
</body></html>
